# Fluent Bit: receive loadgen's JSON array over HTTP (each element becomes a
# record) and write JSON lines to a local file. The HTTP input answers once
# the records are in its in-memory buffer; there are no end-to-end
# acknowledgements and no fsync. Run by bench/compare.sh.
[SERVICE]
    flush        1
    log_level    warn

[INPUT]
    name                     http
    listen                   127.0.0.1
    port                     18082
    successful_response_code 200
    buffer_max_size          8M
    threaded                 on

[OUTPUT]
    name    file
    match   *
    path    ${COMPARE_DIR}
    file    fluent-bit-out.jsonl
    format  plain
    workers ${FB_WORKERS}
