[project]
name = "tremor"
version = "0.1.0"
description = "TREMOR — Trend-aware Real-time Event Monitoring & Outlier Response"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Mokshad" },
    { name = "Kostubh" },
    { name = "Sara" },
    { name = "Varad" },
]

dependencies = [
    # API
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "websockets>=13,<14",
    "pydantic-settings>=2.4,<3",
    "slowapi>=0.1.9,<1",
    # Database
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "alembic>=1.13,<2",
    # AWS
    "boto3>=1.35,<2",
    "tenacity>=9,<10",
    # Detection
    "drain3>=0.9,<1",
    "numpy>=2.0,<3",
    # Logging & Metrics
    "structlog>=24,<25",
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<6",
    "hypothesis>=6.100,<7",
    "moto[sns,logs,cloudwatch]>=5,<6",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "black>=24,<25",
    "mypy>=1.11,<2",
    "pre-commit>=3.8,<4",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "simulator*", "eval*"]

# ── Ruff ──────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "simulator", "eval"]

# ── Black ─────────────────────────────────────────────────────────────
[tool.black]
target-version = ["py312"]
line-length = 100

# ── Mypy ──────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["drain3.*", "moto.*", "prometheus_client.*"]
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --cov=app --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]

# ── Coverage ──────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
fail_under = 50
show_missing = true
